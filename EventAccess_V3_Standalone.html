function siteMap(path=null){const mapEdges=networkEdges.map(([a,b])=>`M${nodes[a].join(' ')} L${nodes[b].join(' ')}`).join(' '),blocked=[...blockedEdges()].map(k=>{let [a,b]=k.split('|');return nodes[a]&&nodes[b]?`<path class="blocked" d="M${nodes[a].join(' ')} L${nodes[b].join(' ')}"/>`:''}).join('');const marks=Object.entries(facility).map(([k,v])=>`<g class="pin ${chosen===k?'active':''} ${closedFacility(k)?'issue':''} ${categoryFilter!=='all'&&v.cat!==categoryFilter?'faded':''}" transform="translate(${v.x} ${v.y})" role="button" tabindex="0" aria-label="${esc(labelLoc(k))}" onclick="chooseFacility('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseFacility('${k}')}"><circle r="21"/><text y="1">${v.mark}</text></g>`).join('');const shownPath=path?`<path class="pathback" d="M${path.path.map(x=>nodes[x].join(' ')).join(' L ')}"/><path class="pathfront" d="M${path.path.map(x=>nodes[x].join(' ')).join(' L ')}"/>`:'';return `<svg class="map-canvas" viewBox="0 0 1080 620" role="img" aria-label="Example event venue floor plan with accessible facilities, connecting corridors, route and blockage markers"><rect x="1" y="1" width="1078" height="618" rx="15" fill="#f6faf9"/><g><rect class="zone" x="353" y="65" width="212" height="168" rx="13"/><rect class="zoneb" x="684" y="64" width="180" height="157" rx="13"/><rect class="zonep" x="883" y="64" width="157" height="157" rx="13"/><rect class="zoneg" x="204" y="538" width="348" height="52" rx="11"/><rect class="zone" x="692" y="536" width="178" height="55" rx="11"/><rect class="zonep" x="887" y="536" width="153" height="55" rx="11"/><rect class="zone" x="80" y="396" width="120" height="72" rx="11"/></g><g><path class="corridor" d="${mapEdges}"/><path class="centerline" d="${mapEdges}"/></g><g><text class="zlabel" x="382" y="128">MAIN EVENT HALL</text><text class="zsmall" x="410" y="151">Programme space</text><text class="zlabel" x="726" y="108">LIFT LOBBY</text><text class="zsmall" x="738" y="135">Lift A</text><text class="zlabel" x="903" y="107">QUIET ROOM</text><text class="zsmall" x="913" y="134">Low stimulation</text><text class="zsmall" x="260" y="566">REGISTRATION / CHECK-IN</text><text class="zsmall" x="715" y="567">ACCESSIBLE TOILET</text><text class="zsmall" x="917" y="567">PRAYER ROOM</text><text class="zsmall" x="97" y="434">ENTRANCE</text><text class="zsmall" x="548" y="275">MAIN CORRIDOR</text><text class="zsmall" x="576" y="466">GROUND FLOOR LINK</text><text class="zsmall" x="812" y="463">EAST WING</text></g>${shownPath}${blocked}<g>${marks}</g><g transform="translate(1000 25)"><circle cx="24" cy="23" r="20" fill="white" stroke="#e0e9e5"/><path d="M24 8 18 29 24 26 30 29Z" fill="#508c7d"/><text x="24" y="58" text-anchor="middle" fill="#7e9694" font-size="11" font-weight="800">N</text></g></svg>`}
function filterButtons(){return `<div class="filter-row">${[['all','all'],['facilities','facilities'],['support','support'],['spaces','spaces']].map(([k,v])=>`<button class="filter-button ${k===categoryFilter?'active':''}" onclick="filterMap('${k}')">${t(v)}</button>`).join('')}</div>`}
function map(){const f=facility[chosen],locReports=activeReports().filter(r=>r.loc===chosen);return `${pageHead('mapTitle','mapSub')}<div class="split"><section class="card map-panel"><div class="map-toolbar"><div class="floor-pill">${ic('map',14)} ${t('ground')}</div>${filterButtons()}</div>${siteMap()}<div class="legend"><span><i></i>${t('greenPin')}</span><span><i class="hazard"></i>${t('redPin')}</span><span><i class="route"></i>${t('greenLine')}</span></div><p class="small-hint">${ic('info',14)} ${t('mapAlerts')} ${t('mapDisclaimer')}</p></section><div class="info-stack"><section class="card pad"><div class="facility-icon">${ic(f.name==='toilet'?'toilet':f.name==='lift'?'lift':'pin',25)}</div><span class="chip ${closedFacility(chosen)?'red':'green'}">${ic(closedFacility(chosen)?'alert':'check',13)} ${esc(statusOfLocation(chosen))}</span><h3>${esc(labelLoc(chosen))}</h3><p>${esc(t(f.desc))}</p><div class="feature-list">${f.items.map(x=>`<div>${ic('check',16)} ${t(x)}</div>`).join('')}${locReports.length?`<div style="color:#a95a49">${ic('alert')} ${locReports.length} ${t('pending')}</div>`:''}</div><button class="btn btn-main btn-full" onclick="routeTo('${chosen}')">${ic('route',16)} ${t('getRoute')}</button></section><section class="card pad"><h3 class="section-head">${t('mapLegend')}</h3><p class="subnote">${t('mapDisclaimer')}</p><button class="btn btn-outline btn-full" onclick="nav('report')">${ic('flag',16)} ${t('reportProblem')}</button></section></div></div>${footer()}`}
function facilityOptions(v){return Object.keys(facility).map(id=>`<option value="${id}" ${v===id?'selected':''}>${esc(labelLoc(id))}</option>`).join('')}
function areaOptions(v=''){return [...Object.keys(facility),...Object.keys(areas)].map(id=>`<option value="${id}" ${id===v?'selected':''}>${esc(labelLoc(id))}</option>`).join('')}
function routePage(){let raw=shortest(start,dest,false),result=currentRoute;let detour=!!(result&&raw&&result.unitDistance>raw.unitDistance+1);let active=blockedEdges().size;return `${pageHead('routeTitle','routeSub')}<div class="route-grid"><section class="card pad"><h2 class="section-head">${t('findRoute')}</h2><p class="subnote" style="margin-bottom:22px">${t('routePref')}</p><div class="form-group"><label class="form-label" for="from">${t('start')}</label><select id="from" class="form-control" onchange="start=this.value;currentRoute=null;render()">${facilityOptions(start)}</select></div><div class="form-group"><label class="form-label" for="to">${t('destination')}</label><select id="to" class="form-control" onchange="dest=this.value;currentRoute=null;render()">${facilityOptions(dest)}</select></div><div class="accessible-pill">${ic('wheel')} ${t('routePref')}</div><div id="route-error" class="tiny-note" aria-live="polite" style="color:#af5852;margin-bottom:9px"></div><button class="btn btn-main btn-full" onclick="findRoute()">${ic('route',16)} ${t('calculate')}</button>${result?`<div class="route-result"><div class="route-result-head">${t('routeFound')} ${ic('check',17)}</div><div class="route-big">~${result.distance} m <small>· ~${result.minutes} ${t('mins')}</small></div><p>${t('previewOnly')}. ${esc(labelLoc(start))} → ${esc(labelLoc(dest))}</p>${detour?`<div class="alert-bubble">${ic('alert',15)} ${t('detour')}</div>`:''}</div><ol class="steps-list"><li><b>1</b>${t('startAt')} ${esc(labelLoc(start))}</li><li><b>2</b>${t('followRoute')}</li><li><b>3</b>${t('arriveAt')} ${esc(labelLoc(dest))}</li></ol>`:`<div class="route-empty">${ic('route')} ${t('selectPrompt')}</div>`}</section><section class="card map-panel"><div class="map-toolbar"><div class="floor-pill">${ic('map',14)} ${t('ground')}</div><span class="chip green">${ic('wheel',13)} ${t('stairFree')}</span></div>${siteMap(result)}${active?`<div class="alert-bubble">${ic('alert',16)} ${t('blockedNote')} (${active})</div>`:''}<p class="small-hint">${ic('info',14)} ${t('notVerified')}</p></section></div>${footer()}`}
function urgencyOptions(){return priorities.map(x=>`<option value="${x}" ${x==='medium'?'selected':''}>${t(x)}</option>`).join('')}
function issueOptions(){return problems.map(([id,label])=>`<option value="${id}">${t(label)}</option>`).join('')}
function recentReports(){return reports.slice(0,3).map(r=>`<div class="recent-item"><div><strong>${esc(r.id)} · ${esc(labelCategory(r.category))}</strong><small>${esc(labelLoc(r.loc))}</small></div><button class="table-btn" onclick="openTrack('${r.id}')">${t('track')}</button></div>`).join('')||`<p class="subnote">${t('noIssues')}</p>`}
function reportPage(){return `${pageHead('reportTitle','reportSub')}<div class="report-grid"><section class="card pad">${lastReport?`<div class="banner success">${ic('check',17)} ${t('successText')} <strong>${esc(lastReport)}</strong></div>`:''}<h2 class="section-head">${t('tellUs')}</h2><p class="subnote" style="margin-bottom:22px">${t('tellSub')}</p><form id="issue-form" onsubmit="submitIssue(event)"><div class="form-grid"><div class="form-group"><label class="form-label" for="issue-type">${t('issueType')} *</label><select required id="issue-type" class="form-control"><option value="" disabled selected>${t('chooseType')}</option>${issueOptions()}</select></div><div class="form-group"><label class="form-label" for="issue-location">${t('location')} *</label><select required id="issue-location" class="form-control"><option value="" disabled selected>${t('chooseLocation')}</option>${areaOptions()}</select></div></div><div class="form-group"><label class="form-label" for="issue-priority">${t('priority')}</label><select id="issue-priority" class="form-control">${urgencyOptions()}</select></div><div class="form-group"><label class="form-label" for="issue-description">${t('details')} *</label><textarea id="issue-description" class="form-control textarea" required minlength="10" maxlength="500" placeholder="${esc(t('detailPlaceholder'))}"></textarea><div class="tiny-note">10–500 characters</div></div><div class="form-group"><label for="issue-image" class="form-label">${t('photo')}</label><div class="upload-box">${ic('photo',21)}<div style="min-width:0"><input type="file" accept="image/jpeg,image/png,image/webp" id="issue-image" onchange="readPhoto(event)"/><small>${t('photoHelp')}</small></div></div><div id="image-preview" aria-live="polite"></div></div><div class="privacy">${ic('shield',15)} <span>${t('privacy')}</span></div><button class="btn btn-main" type="submit">${ic('flag',17)} ${t('submit')}</button><p class="tiny-note" style="margin-top:12px">${t('formNote')}</p></form></section><aside><section class="card pad"><div class="facility-icon">${ic('shield')}</div><h2 class="section-head">${t('whatNext')}</h2><div class="workflow"><div class="flow-step"><span class="flow-step-number">01</span><div><b>${t('flow1')}</b><p>${t('flow1Text')}</p></div></div><div class="flow-step"><span class="flow-step-number">02</span><div><b>${t('flow2')}</b><p>${t('flow2Text')}</p></div></div><div class="flow-step"><span class="flow-step-number">03</span><div><b>${t('flow3')}</b><p>${t('flow3Text')}</p></div></div></div></section><div class="banner warn" style="margin:15px 0"><span>${ic('alert',17)}</span><span><b>${t('safety')}</b><br>${t('safetyText')}</span></div><section class="card pad recent"><h3 class="section-head">${t('tracking')}</h3><p class="subnote">${t('trackingSub')}</p>${recentReports()}</section></aside></div>${footer()}`}
function dashboard(){let filtered=dashboardStatus==='all'?reports:reports.filter(r=>r.status===dashboardStatus);return `${pageHead('dashTitle','dashSub')}<div class="banner">${ic('info',17)} ${t('dashAlert')}</div><div class="dash-metrics">${metric('list',reports.length,'total')}${metric('alert',reports.filter(r=>r.status==='New').length,'new','orange')}${metric('clock',reports.filter(r=>r.status==='In progress').length,'progress','blue')}${metric('check',reports.filter(r=>r.status==='Resolved').length,'resolved','purple')}</div><div class="dash-layout"><section class="card" style="overflow:hidden"><div class="pad flex between gap" style="flex-wrap:wrap"><div><h2 class="section-head">${t('reports')}</h2><p class="subnote">${t('reportsSub')}</p></div><div class="filter-combo">${[['all','all'],['New','new'],['In progress','progress'],['Resolved','resolved']].map(([k,label])=>`<button class="filter-button ${dashboardStatus===k?'active':''}" onclick="setDashboardStatus('${k}')">${t(label)}</button>`).join('')}</div></div><div class="table-wrap"><table class="issue-table"><thead><tr><th>${t('issue')}</th><th>${t('location')}</th><th>${t('priority')}</th><th>${t('status')}</th><th>${t('action')}</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><span class="report-id">${esc(r.id)}</span><strong>${esc(labelCategory(r.category))}</strong></td><td>${esc(labelLoc(r.loc))}</td><td><span class="chip ${r.urgency==='high'?'red':'amber'}">${t(r.urgency||'medium')}</span></td><td>${statusChip(r.status)}</td><td><button class="table-btn" onclick="openManage('${r.id}')">${t('manage')} ${ic('arrow',12)}</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">${t('empty')}</div></td></tr>`}</tbody></table></div></section><aside class="card pad"><h3 class="section-head">${t('activity')}</h3><p class="subnote">${t('activitySub')}</p><div class="activity-list"><div class="activity-line"><span class="dot"></span><div><b>${t('a1')}</b><p>${t('a1Text')}</p></div></div><div class="activity-line"><span class="dot" style="background:#578db8;border-color:#e2edf6"></span><div><b>${t('a2')}</b><p>${t('a2Text')}</p></div></div><div class="activity-line"><span class="dot" style="background:#a585c7;border-color:#f1eafa"></span><div><b>${t('a3')}</b><p>${t('a3Text')}</p></div></div></div><div class="dash-cta"><b>${t('tryJourney')}</b><p>${t('tryJourneyText')}</p><button class="btn btn-main" onclick="nav('report')">${t('createReport')} ${ic('arrow',15)}</button></div><button class="btn btn-outline btn-full" style="margin-top:16px" onclick="resetDemo()">${ic('refresh',14)} ${t('reset')}</button></aside></div>${footer()}`}
function render(){let page=location.hash.slice(1).split('?')[0]||'home';if(!menu.some(m=>m[0]===page))page='home';document.documentElement.lang=language==='ms'?'ms':'en';document.getElementById('nav-links').innerHTML=menu.map(([id,name,sym])=>`<button class="nav-link ${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="nav('${id}')">${ic(sym)}<span>${t(name)}</span></button>`).join('');document.getElementById('crumb-name').textContent=t(menu.find(x=>x[0]===page)[1]);document.querySelector('[data-t="sidebarHelpTitle"]').textContent=t('sidebarHelpTitle');document.querySelector('[data-t="sidebarHelpText"]').textContent=t('sidebarHelpText');document.querySelector('#sidebar-help-btn').innerHTML=t('sidebarButton')+' <span>↗</span>';document.getElementById('lang-button').textContent=language==='en'?'BM':'EN';document.getElementById('view').innerHTML=({home,map,routes:routePage,report:reportPage,dashboard})[page]();}
function filterMap(k){categoryFilter=k;if(categoryFilter!=='all'&&facility[chosen].cat!==k)chosen=Object.keys(facility).find(id=>facility[id].cat===k)||chosen;render()}
function chooseFacility(k){chosen=k;render()}
function routeTo(k){dest=k;currentRoute=null;nav('routes')}
function findRoute(){if(start===dest){document.getElementById('route-error').textContent=t('samePlace');return}currentRoute=shortest(start,dest,true);render();if(!currentRoute){document.getElementById('route-error').textContent=t('noRoute');showToast(t('noRoute'))}}
function setDashboardStatus(k){dashboardStatus=k;render()}
function readPhoto(event){let file=event.target.files?.[0],p=document.getElementById('image-preview');picture='';p.innerHTML='';if(!file)return;if(file.size>2*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){showToast(t('photoTooLarge'));event.target.value='';return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{let scale=Math.min(1,620/Math.max(im.width,im.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);picture=canvas.toDataURL('image/jpeg',.68);p.innerHTML=`<img class="preview-img" src="${picture}" alt="${esc(t('newPhoto'))}"/><p class="tiny-note">${t('unsaved')}</p>`};im.src=reader.result};reader.readAsDataURL(file)}
function submitIssue(e){e.preventDefault();let type=document.getElementById('issue-type').value,loc=document.getElementById('issue-location').value,urgency=document.getElementById('issue-priority').value,details=document.getElementById('issue-description').value.trim();if(!type||!loc||details.length<10)return;let id='EA-'+String(Date.now()).slice(-7),now=new Date().toLocaleString(language==='ms'?'ms-MY':'en-MY');reports.unshift({id,category:type,loc,urgency,details,status:'New',team:'Unassigned',notes:'',photo:picture,created:now,updated:now});let saved=persist();if(!saved)showToast(t('cannotSavePhoto'));picture='';lastReport=id;currentRoute=null;render();window.scrollTo({top:0,behavior:'smooth'});showToast(t('successText'))}
function modal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="EventAccess dialogue">${content}</section></div>`;document.querySelector('.modal button')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';selectedTicket=null}
function openManage(id){let r=reports.find(x=>x.id===id);if(!r)return;selectedTicket=id;modal(`<div class="modal-head"><div><div class="kicker">${esc(r.id)} · ${t('issue')}</div><h3>${t('manage')}</h3></div><button class="close-btn" onclick="closeModal()" aria-label="${t('close')}">${ic('close')}</button></div><p class="modal-desc"><b>${esc(labelCategory(r.category))}</b><br>${esc(labelLoc(r.loc))} · ${t(r.urgency||'medium')}</p><div class="muted-box" style="margin-bottom:18px">${esc(r.details)}</div>${r.photo?`<div class="form-group"><label class="form-label">${t('photosDemo')}</label><img class="preview-img" src="${r.photo}" alt="Locally submitted evidence"/></div>`:''}<div class="form-group"><label class="form-label" for="assign">${t('assign')}</label><select id="assign" class="form-control">${teams.map(x=>`<option ${x===r.team?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="status">${t('status')}</label><select id="status" class="form-control">${states.map(x=>`<option value="${x}" ${x===r.status?'selected':''}>${statusLabel(x)}</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="notes">${t('notes')}</label><textarea class="form-control textarea" id="notes" maxlength="350">${esc(r.notes||'')}</textarea></div><p class="tiny-note">${t('actionHistory')}</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-main" onclick="saveIssue()">${ic('check')} ${t('save')}</button></div>`)}
function saveIssue(){let r=reports.find(x=>x.id===selectedTicket);if(!r)return;r.team=document.getElementById('assign').value;r.status=document.getElementById('status').value;r.notes=document.getElementById('notes').value.trim();r.updated=new Date().toLocaleString(language==='ms'?'ms-MY':'en-MY');persist();currentRoute=null;closeModal();render();showToast(t('updateSaved'))}

erification')}</h3><p>${t('noticePending')}</p></div><div class="step"><span class="step-index">02</span><h3>${t('quickRouting')}</h3><p>${t('routeNoteLift')}</p></div><div class="step"><span class="step-index">03</span><h3>${t('quickStaff')}</h3><p>${t('organiserMustClose')}</p></div></div></section><section class="card pad"><h3 class="section-head">${t('roleExplain')}</h3><p class="subnote">${t('roleSwitchHint')}</p><div class="v3-role-summary"><button class="btn btn-outline" onclick="V3_changeRole('attendee');nav('report')">${t('roleAttendee')}</button><button class="btn btn-outline" onclick="V3_changeRole('organiser');nav('dashboard')">${t('roleOrganiser')}</button><button class="btn btn-outline" onclick="V3_changeRole('staff');nav('tasks')">${t('roleStaff')}</button></div><div class="v3-inline-feature" style="margin-top:16px">${ic('shield',17)} ${t('demoBanner')}</div></section></div>${footer()}`}
function V3_changeRole(role){if(!V3_ROLE.includes(role))return;V3_role=role;savePreference('ea3_role',role);const link=location.hash.slice(1)||'home';if(!V3_MENU[role].some(i=>i[0]===link))location.hash='#home';render()}
function V3_reset(){if(!confirm(t('confirmReset')))return;reports=structuredClone(V3_SEEDS);V3_store();lastReport=null;currentRoute=null;V3_annFilter='all';render();showToast(t('resetV3'))}
resetDemo=V3_reset;
function V3_render(){let page=location.hash.slice(1).split('?')[0]||'home';const m=V3_MENU[V3_role];if(!m.some(item=>item[0]===page))page='home';document.documentElement.lang=language==='ms'?'ms':'en';document.getElementById('nav-links').innerHTML=m.map(([id,label,sym])=>`<button class="nav-link ${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="nav('${id}')">${ic(sym)}<span>${t(label)}</span></button>`).join('');document.getElementById('crumb-name').textContent=t(m.find(v=>v[0]===page)[1]);document.querySelector('[data-t="sidebarHelpTitle"]').textContent=t('sidebarHelpTitle');document.querySelector('[data-t="sidebarHelpText"]').textContent=t('sidebarHelpText');document.getElementById('sidebar-help-btn').innerHTML=t('sidebarButton')+' <span>↗</span>';document.getElementById('lang-button').textContent=language==='en'?'BM':'EN';document.getElementById('role-picker').value=V3_role;document.getElementById('view').innerHTML=({home:V3_home,map:V3_map,routes:V3_routePage,report:reportPage,track:V3_trackingPage,dashboard:V3_dashboard,analytics:V3_analyticsPage,tasks:V3_tasksPage})[page]();document.title='EventAccess V3 · '+t(m.find(v=>v[0]===page)[1]);}
render=V3_render;
function V3_findRoute(){if(start===dest){document.getElementById('route-error').textContent=t('samePlace');return}currentRoute=V3_shortest(start,dest,true);if(currentRoute)V3_floor=V3_LOCATION_FLOOR(start);render();if(!currentRoute){document.getElementById('route-error').textContent=t('noRouteAsk');showToast(t('noRouteAsk'))}}
findRoute=V3_findRoute;
function V3_startQr(){V3_qr=qrChoice;chosen=qrChoice;start=qrChoice;dest='toilet';V3_floor=V3_LOCATION_FLOOR(qrChoice);closeModal();nav('map');showToast(t('qrFloor')+' · '+V3_labelLoc(V3_qr))}
startQrJourney=V3_startQr;
// replace V2 report-form location list including all upper-floor places
const V3_reportBase=reportPage;
reportPage=function(){return V3_reportBase().replace('></select></div></div><div class="form-group"><label for="issue-priority"','></select></div></div><div class="form-group"><label for="issue-priority"');};
// Reuse V2 reportPage, whose options now reflect the V3 facilities and the report submit override.
// The initial report is never considered a verified closure.
document.getElementById('role-picker').addEventListener('change',e=>V3_changeRole(e.target.value));
// Dismiss any V2 pages left in local storage with an explicit separate V3 namespace.
render();
</script>
</body>
